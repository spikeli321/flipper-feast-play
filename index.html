<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flipper Feast">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Flipper Feast</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1418; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ff8cc0; font: 900 20px "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="boot">Preheating the oven…</div>
<canvas id="game" tabindex="0"></canvas>
<script src="game.js"></script>
<script>var b=document.getElementById('boot'); if (b) b.remove();</script>
</body>
</html>
